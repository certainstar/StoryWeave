name: build

on:
  push:
    branches: 
      - master
  pull_request:

permissions:
  contents: read

# 保证同一时间只有一个构建任务在运行，避免资源冲突
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Frontend

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 保证各平台构建结果互不干扰，即使某个平台构建失败，也继续构建其他平台
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    steps:
      - name: Check out the repository to the runner's workspace
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Frontend/pnpm-lock.yaml
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rust-src
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Frontend/src-tauri
      - name: Install Linux webview libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2 libxdo-dev \
            libssl-dev build-essential libgtk-3-dev
      - name: Install dependencies
        run: pnpm install
      - name: Typecheck the interface
        run: pnpm exec vue-tsc --noEmit
      - name: Test the local commands
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build the desktop app
        run: pnpm build
      # 将构建的安装包上传到 GitHub Actions 的 Artifacts 中
      # macOS: DMG 安装包
      - name: Upload macOS installer
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: storyweave-macos
          path: Frontend/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
      # Windows: NSIS 安装包或 MSI 安装包
      - name: Upload Windows installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: storyweave-windows
          path: |
            Frontend/src-tauri/target/release/bundle/nsis/*.exe
            Frontend/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7
      # Linux: Debian 安装包或 AppImage
      - name: Upload Linux installer
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: storyweave-linux
          path: |
            Frontend/src-tauri/target/release/bundle/deb/*.deb
            Frontend/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7